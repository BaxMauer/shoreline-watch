name: Production candidate

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: production-candidate
  cancel-in-progress: true

jobs:
  package:
    name: Package verified Sites source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SITES_BUILD_TIMEOUT: 5m

    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate Sites artifact
        run: npm run build

      - name: Package immutable source and build
        run: |
          git archive --format=tar.gz \
            --output="${RUNNER_TEMP}/shoreline-source.tgz" \
            "${SOURCE_SHA}"
          tar -C dist -czf "${RUNNER_TEMP}/shoreline-dist.tgz" .

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: sites-production-candidate-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/shoreline-source.tgz
            ${{ runner.temp }}/shoreline-dist.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Mark commit ready for Sites deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SOURCE_SHA,
              state: "success",
              context: "sites/deployment-candidate",
              description: "Verified Sites source and build are ready",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
