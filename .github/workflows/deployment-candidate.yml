name: Production candidate

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: production-candidate
  cancel-in-progress: true

jobs:
  package:
    name: Package verified Sites source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SITES_BUILD_TIMEOUT: 5m

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate Sites artifact
        run: npm run build

      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Package immutable source and build
        run: |
          git archive --format=tar.gz \
            --output="${RUNNER_TEMP}/shoreline-source.tgz" \
            "${SOURCE_SHA}"
          tar -C dist -czf "${RUNNER_TEMP}/shoreline-dist.tgz" .
          node scripts/write-deployment-manifest.mjs \
            "${RUNNER_TEMP}/deployment-manifest.json"

      - name: Upload production candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sites-production-candidate-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/deployment-manifest.json
            ${{ runner.temp }}/shoreline-source.tgz
            ${{ runner.temp }}/shoreline-dist.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Mark commit ready for Sites deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SOURCE_SHA,
              state: "success",
              context: "sites/deployment-candidate",
              description: "Verified Sites source and build are ready",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
